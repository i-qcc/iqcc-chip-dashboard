[project]
name = "iqcc-chip-dashboard"
version = "0.1.0"
description = "Kiosk dashboard presenting the live state of IQCC quantum chips (QPU health, coherence, readout, 1Q/2Q gate fidelities) from the IQCC cloud."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "iqcc-cloud-client>=0.19.2",
]

[tool.uv]
prerelease = "allow"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
